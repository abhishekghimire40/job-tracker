name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch/PR when a newer commit arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          # TODO: pin to an exact version once the first run is green
          version: latest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Build only, no push: proves the Dockerfile still works
      - run: docker build -t job-tracker:ci .
